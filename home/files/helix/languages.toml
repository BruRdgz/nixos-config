# Scala through scala-psi-host (the IntelliJ Scala plugin as a language server) instead of Metals.
# The project needs a BSP connection file: run `sbt bspConfig` in it once.
[language-server.scala-psi-host]
command = "/home/seraphiine/Documentos/desenvolvimento/pessoal/scala-psi-host/target/dist/bin/scala-psi-host"
environment = { JAVA_HOME = "/home/seraphiine/.cache/coursier/arc/https/github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%252B8/OpenJDK25U-jdk_x64_linux_hotspot_25.0.5_8.tar.gz/jdk-25.0.5+8" }
# Opening a build over BSP starts sbt and indexes its libraries; on a large project the first start takes a while.
timeout = 300

[[language]]
name = "scala"
language-servers = ["scala-psi-host"]
