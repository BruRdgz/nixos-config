# Small, readable prompt with no special glyph requirements.
add_newline = false
format = "$directory$git_branch$git_status$character"

[directory]
truncation_length = 3

[git_branch]
format = " [$branch]($style)"

[git_status]
format = " [$all_status$ahead_behind]($style)"

[character]
success_symbol = ">"
error_symbol = ">"
