# ── GENERAL ────────────────────────────────────────────────────────────────

set -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

set -g history-limit 50000
set -s escape-time 10
set -g mouse on
set -g focus-events on
set -g status-interval 5

setw -g mode-keys vi
set -g status-keys vi

# Clipboard: OSC 52 and wl-copy when available locally.
set -g set-clipboard on
if-shell 'command -v wl-copy >/dev/null 2>&1' \
  'set -g copy-command "wl-copy"' \
  'set -gu copy-command'

# Prefix: Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Indices from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── WINDOWS AND PANES ──────────────────────────────────────────────────────

bind / split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ── COPY MODE ──────────────────────────────────────────────────────────────

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# A barra de status é gerada a partir da paleta (home/shell.nix).

# ── TPM / PLUGINS ──────────────────────────────────────────────────────────

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ── RESURRECT / CONTINUUM ──────────────────────────────────────────────────

set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-processes 'hx'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @continuum-restore-max-delay '30'

# tmux-sensible intentionally defaults status keys to emacs; keep the
# requested vi behavior after plugin initialization and on later attaches.
set-hook -g session-created 'set-option -g status-keys vi'
set-hook -g client-attached 'set-option -g status-keys vi'

# ── TPM BOOTSTRAP ──────────────────────────────────────────────────────────

if-shell 'test ! -d "$HOME/.config/tmux/plugins/tpm"' \
  'run-shell "git clone https://github.com/tmux-plugins/tpm $HOME/.config/tmux/plugins/tpm && $HOME/.config/tmux/plugins/tpm/bin/install_plugins"'

# TPM must remain the final command.
run-shell "$HOME/.config/tmux/plugins/tpm/tpm"
